migrations:
- what: Toutiao advertising / Marketing API
  from: https://ad.toutiao.com/openapi/doc/index.html
  to: https://open.oceanengine.com/docs/
  mechanism: HTTP 301 → 301 → 302 chain, no deprecation notice served
  chain:
  - status: 301
    location: https://ad.oceanengine.com/openapi/doc/index.html
  - status: 301
    location: https://open.oceanengine.com/doc/index.html
  - status: 302
    location: https://open.oceanengine.com/docs/
  - status: 200
  detail: >-
    The Toutiao ads open platform has been folded into OceanEngine (巨量引擎), ByteDance's
    unified advertising platform. Advertising APIs are no longer a Toutiao-branded surface;
    they are catalogued under OceanEngine.
  observed: '2026-08-05'
- what: Toutiao developer platform (mini programs)
  from: https://developer.toutiao.com/
  to: https://microapp.bytedance.com/
  mechanism: HTTP 301, no deprecation notice served
  chain:
  - status: 301
    location: https://microapp.bytedance.com/
  - status: 200
  detail: >-
    The Toutiao-branded developer host now redirects to the ByteDance mini-app / mini-game
    developer platform, which serves Toutiao, Douyin and Xigua mini programs from one portal.
  observed: '2026-08-05'
