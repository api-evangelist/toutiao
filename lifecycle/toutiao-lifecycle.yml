note: >-
  Toutiao publishes no versioning policy, no deprecation policy, no SLA and no status page.
  What it does have is two observable platform migrations, captured below from live 301/302
  redirect chains — that is real lifecycle evidence, but it is not a policy, and no
  Deprecation or StatusPage pointer is wired on the strength of it.
