format: custom
note: >-
  Toutiao does not use RFC 9457 problem+json. It returns HTTP 200 for application-level
  failures and carries the real outcome in a JSON envelope. Every code below was either
  observed in a live unauthenticated probe or is named in the provider's published
  documentation; none are inferred.
envelope:
  content_type: application/json
  http_status_on_error: 200
  shape:
    message: '"error" on failure; the transport status stays 200'
    data.error_code: integer error code
    data.description: human-readable message, Chinese
    data.desc_url: optional help URL returned by the platform
    data.captcha: optional captcha challenge payload
  example_observed: '{"data":{"captcha":"","desc_url":"","description":"缺少参数","error_code":10005},"message":"error"}'
  agent_warning: >-
    Because failures return HTTP 200, a client that branches on transport status alone will
    treat every error as a success. Agents and SDKs must parse message and data.error_code.
