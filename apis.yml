aid: toutiao
name: Toutiao
description: 'Toutiao (今日头条) is ByteDance''s AI-driven content recommendation platform,
  launched in 2012, aggregating news, articles, short video and micro-posts into a
  personalized feed for hundreds of millions of readers in China. Creators publish
  through 头条号 (Toutiao Hao) accounts on mp.toutiao.com, and third-party developers
  integrate through the ByteDance open-platform stack: Toutiao account OAuth 2.0 and
  user-profile APIs served from open.snssdk.com and documented on the Douyin Open
  Platform under the toutiao-or-xigua section, a content-sync and video publishing
  surface available to approved applications, mini-programs via the ByteDance mini-app
  developer platform, and advertising APIs that have since migrated from ad.toutiao.com
  to OceanEngine (巨量引擎). Toutiao publishes no OpenAPI, AsyncAPI, llms.txt or A2A
  agent card; its developer program is registration- and approval-gated and its documentation
  is client-side rendered in Chinese.'
